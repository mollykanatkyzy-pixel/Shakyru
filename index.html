<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Тойға шақыру</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #f8f2e8;
      color: #49392d;
      text-align: center;
    }

    .page {
      min-height: 100vh;
      padding: 70px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .small {
      font-size: 17px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 48px;
      margin: 25px 0 10px;
      font-weight: normal;
    }

    .line {
      width: 70px;
      height: 1px;
      background: #a88a63;
      margin: 25px auto;
    }

    .text {
      max-width: 500px;
      font-size: 20px;
      line-height: 1.7;
    }

    .date {
      font-size: 30px;
      margin-top: 30px;
    }

    .time {
      font-size: 21px;
      margin-top: 10px;
    }

    .place {
      margin-top: 35px;
      font-size: 19px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 35px;
      padding: 15px 30px;
      border: 1px solid #8c7254;
      border-radius: 30px;
      color: #49392d;
      text-decoration: none;
      font-size: 17px;
    }

    .heart {
      font-size: 28px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <section class="page">

    <div class="heart">♡</div>

    <div class="small">
      Сіздерді тойымызға шақырамыз
    </div>

    <h1>
      Димаш & Жансая
    </h1>

    <div class="line"></div>

    <div class="text">
      Құрметті ағайын-туыс, құда-жекжат,
      дос-жарандар!
      <br><br>
      Сіздерді қуанышымыздың қадірлі
      қонағы болуға шақырамыз.
    </div>

    <div class="date">
      12 қыркүйек 2026
    </div>

    <div class="time">
      сағат 18:00
    </div>

    <div class="place">
      Той салтанаты<br>
      NIET HALL
    </div>

    <a class="button" href="#">
      Мекенжайды көру
    </a>

  </section>

</body>
</html>
